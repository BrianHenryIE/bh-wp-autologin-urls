name: Run PHP CodeSniffer

# Run PHPCBF to fix changes then annotate PHPCS
# NB: Pull requests from forks do not have access to repository secrets so cannot commit changes.

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize]

jobs:
  php-codesniffer:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [ '8.4' ]

#    env:
#      COMPOSER_ALLOW_UNSAFE_PHAR_METADATA: 1 # "Refusing to parse a tar/phar archive on PHP < 8.0 because it is not safe to process untrusted archives on that PHP version."

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer, cs2pr
          extensions: zip

      # Local path repositories point at sibling checkouts CI does not have. Rewrite them to the
      # equivalent GitHub repository, keeping the constraint — `brianhenryie/bh-wp-rate-limiter`
      # is not published on Packagist, so dropping the repository entirely cannot resolve.
      - name: Replace local repository references
        run: |
          jq '
            .repositories |= with_entries(
              if .value.type == "path"
              then .value = { "type": "vcs", "url": ("https://github.com/" + .key) }
              else . end
            )
          ' composer.json > composer.json.tmp
          mv composer.json.tmp composer.json

      # `composer update`, not `install`: the step above rewrote composer.json.
      - name: Run composer install
        run: composer update --no-scripts # We don't need the vendor-prefixed files for PHPCS.

      - name: Run PHPCBF to fix what it can
        continue-on-error: true
        run: vendor/bin/phpcbf

      - name: Commit PHPCBF changes
        if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "🤖 PHPCBF"

      - name: Run PHPCS to add annotations to the code
        continue-on-error: true
        run: vendor/bin/phpcs -q -n --report=checkstyle | cs2pr

      - name: Fail if there are still phpcs errors in the production code
        run: vendor/bin/phpcs src
